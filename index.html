<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Budget</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mu:#6b7a88;--ac:#0f766e;--pos:#15803d;--neg:#dc2626;--warn:#b45309;--bd:#e3e8ed}
@media(prefers-color-scheme:dark){:root{--bg:#0e1419;--card:#18212a;--tx:#e8eef3;--mu:#8fa0ae;--ac:#2dd4bf;--pos:#4ade80;--neg:#f87171;--warn:#fbbf24;--bd:#27333e}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 96px}
main,header,#login{max-width:760px;margin:0 auto;padding:12px 16px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:20px 0 8px}a{color:var(--ac)}
.card,.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{color:var(--mu);font-size:13px}.v{font-size:20px;font-weight:700}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}.muted{color:var(--mu)}
input,select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600;width:auto}
button.ghost{background:transparent;color:var(--mu);border:1px solid var(--bd)}
button.x{background:transparent;color:var(--neg);padding:4px 8px;font-size:20px}
.form{display:grid;gap:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;gap:6px}.seg button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:8px 6px;font-size:14px}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.grow{flex:1;min-width:0}.sm{font-size:13px;color:var(--mu)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.lg{display:flex;gap:14px;font-size:13px;color:var(--mu);margin-top:6px}.lg span{display:flex;align-items:center;gap:5px}
.bi{fill:var(--pos)}.bo{fill:var(--neg)}.bt{fill:var(--mu);font-size:9px}
.bar{height:8px;background:var(--bd);border-radius:6px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:500}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;width:100%;max-width:760px}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:14px 2px;font-size:13px}nav button.on{color:var(--ac)}
.pn{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}.pn b{font-size:17px}.pn button{padding:8px 14px}
[hidden]{display:none!important}
</style></head><body>

<div id="login" hidden>
  <h1>My Budget</h1><p class="muted">Sign in to the shared budget account.</p>
  <div class="form box">
    <input id="em" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <div class="two"><button onclick="signIn()">Sign in</button><button class="ghost" onclick="signUp()">Create account</button></div>
    <div id="err" class="neg sm"></div>
  </div>
</div>

<div id="app" hidden>
<header><h1>My Budget</h1><button id="out" class="ghost" onclick="signOut()" hidden>Sign out</button></header>
<main>
<section id="v-sum">
  <div class="seg"><button id="bw" onclick="setPer('week')">Weekly</button><button id="bm" class="on" onclick="setPer('month')">Monthly</button></div>
  <div class="pn"><button class="ghost" onclick="off--;render()">‹</button><b id="plabel"></b><button class="ghost" onclick="off++;render()">›</button></div>
  <div class="grid" id="cards"></div>
  <h2>Income vs spending</h2><div class="box" id="chart"></div>
  <h2>Spending by category</h2><div class="box" id="cats"></div>
  <h2>Recent periods</h2><div class="box"><table><thead><tr><th>Period</th><th>In</th><th>Out</th><th>Net</th></tr></thead><tbody id="hist"></tbody></table></div>
</section>

<section id="v-day" hidden>
  <div class="pn"><button class="ghost" onclick="shDay(-1)">‹</button><input id="dday" type="date" onchange="render()" style="width:auto"><button class="ghost" onclick="shDay(1)">›</button></div>
  <div class="grid" id="dcards"></div>
  <h2>Last 7 days</h2><div class="box" id="dchart"></div>
  <h2>Entries</h2><div class="box" id="dlist"></div>
</section>

<section id="v-money" hidden>
  <div class="box form">
    <div class="seg"><button id="mi" class="on" onclick="setMode('in')">Money in</button><button id="mo" onclick="setMode('out')">Money out</button></div>
    <select id="acct"></select>
    <div class="two"><input id="amt" type="number" inputmode="decimal" step="0.01" placeholder="Amount"><input id="date" type="date"></div>
    <input id="desc" placeholder="Description (e.g. Salary, Groceries)">
    <input id="cat" list="cats-l" placeholder="Category">
    <datalist id="cats-l"><option>Salary</option><option>Food</option><option>Rent</option><option>Transport</option><option>Bills</option><option>Shopping</option><option>Health</option><option>Other</option></datalist>
    <button onclick="addTx()">Add</button>
  </div>
  <h2>History</h2><div class="box" id="txs"></div>
</section>

<section id="v-acc" hidden>
  <div class="grid" id="acards"></div>
  <h2>Transfer between accounts</h2>
  <div class="box form">
    <div class="sm">From → To</div>
    <div class="two"><select id="trfrom"></select><select id="trto"></select></div>
    <div class="two"><input id="tra" type="number" inputmode="decimal" step="0.01" placeholder="Amount"><input id="trf" type="number" inputmode="decimal" step="0.01" placeholder="Fee (optional)"></div>
    <div class="two"><input id="trd" type="date"><input id="trn" placeholder="Note (optional)"></div>
    <button onclick="addTr()">Transfer</button>
  </div>
  <h2>Account history</h2><div class="seg" id="chips" style="flex-wrap:wrap;margin-bottom:8px"></div><div class="box" id="alist"></div>
</section>

<section id="v-debt" hidden>
  <div class="box form">
    <input id="dn" placeholder="Debt name (e.g. Credit card, Loan from John)">
    <div class="two"><input id="dt" type="number" inputmode="decimal" step="0.01" placeholder="Total owed"><input id="dp" type="number" inputmode="decimal" step="0.01" placeholder="Already paid (optional)"></div>
    <input id="dd" type="date"><div class="sm">Due date (optional)</div>
    <button onclick="addDebt()">Add debt</button>
  </div>
  <h2>Debts</h2><div class="sm" style="margin-bottom:6px">Pay debts from:</div><select id="payacct" style="margin-bottom:8px"></select>
  <div class="box" id="debts"></div>
</section>
</main>
<nav><div>
  <button class="tab on" data-v="sum" onclick="go('sum')">Summary</button>
  <button class="tab" data-v="day" onclick="go('day')">Daily</button>
  <button class="tab" data-v="money" onclick="go('money')">Money</button>
  <button class="tab" data-v="acc" onclick="go('acc')">Accounts</button>
  <button class="tab" data-v="debt" onclick="go('debt')">Debts</button>
</div></nav>
</div>

<script>
/* ===== SETUP: paste your Firebase web config here to enable online sync + login. Leave apiKey empty for offline/local-only mode. ===== */
const CFG={apiKey:"",authDomain:"",projectId:"",appId:""};
const CUR="₱";
const ACCTS=[["maribank","Maribank"],["maya","Maya"],["gcash","GCash"],["cash","Cash on hand"]];
/* ========================================================================== */
const $=id=>document.getElementById(id);
const norm=x=>{x=x||{};x.tx=x.tx||[];x.debts=x.debts||[];x.open=x.open||{};return x};
let S=norm(),view="sum",per="month",off=0,mode="in",fa="all",ref=null,fs=null,auth=null;
const V=["sum","day","money","acc","debt"],PAL=["#0f766e","#f59e0b","#3b82f6","#ec4899","#8b5cf6","#ef4444","#10b981","#64748b"];
const fmt=n=>(n<0?"-":"")+CUR+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fd=d=>d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const an=k=>(ACCTS.find(a=>a[0]==k)||[0,"Cash on hand"])[1];
const card=(k,v,c)=>`<div class="card"><div class="k">${k}</div><div class="v ${c}">${fmt(v)}</div></div>`;

function save(){
  if(ref)ref.set(S).catch(e=>alert("Could not save: "+e.message));
  else localStorage.setItem("budget",JSON.stringify(S));
  render();
}
function go(v){view=v;render()}
function setPer(p){per=p;off=0;$("bw").classList.toggle("on",p=="week");$("bm").classList.toggle("on",p=="month");render()}
function setMode(m){mode=m;$("mi").classList.toggle("on",m=="in");$("mo").classList.toggle("on",m=="out")}
function shDay(n){const d=new Date($("dday").value+"T00:00:00");d.setDate(d.getDate()+n);$("dday").value=iso(d);render()}

/* ---- calculations ---- */
function range(o){
  const n=new Date();let a,b;
  if(per=="week"){a=new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7)+o*7);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6)}
  else{a=new Date(n.getFullYear(),n.getMonth()+o,1);b=new Date(a.getFullYear(),a.getMonth()+1,0)}
  return[iso(a),iso(b),a,b];
}
function tot(a,b){let i=0,o=0;S.tx.forEach(t=>{if(t.date>=a&&t.date<=b){if(t.type=="in")i+=+t.amount;else if(t.type=="out")o+=+t.amount}});return[i,o]}
function bal(a){let b=+(S.open[a]||0);S.tx.forEach(t=>{const x=+t.amount;if(t.type=="tr"){if(t.from==a)b-=x;if(t.to==a)b+=x}else if((t.acct||"cash")==a)b+=t.type=="in"?x:-x});return b}
const allBal=()=>ACCTS.reduce((s,a)=>s+bal(a[0]),0);
const debtLeft=()=>S.debts.reduce((s,d)=>s+Math.max(0,d.total-d.paid),0);
function mon(a){const n=new Date(),f=iso(new Date(n.getFullYear(),n.getMonth(),1)),l=iso(new Date(n.getFullYear(),n.getMonth()+1,0));let i=0,o=0;
  S.tx.forEach(t=>{if(t.date<f||t.date>l)return;const x=+t.amount;
    if(t.type=="tr"){if(t.to==a)i+=x;if(t.from==a)o+=x}else if((t.acct||"cash")==a){t.type=="in"?i+=x:o+=x}});return[i,o]}

/* ---- charts (inline SVG, no libraries) ---- */
function bars(d){
  const W=320,H=140,m=Math.max(1,...d.flatMap(x=>[x.i,x.o])),w=W/d.length,bw=w*.32;
  return `<svg viewBox="0 0 ${W} ${H+20}" width="100%">`+d.map((x,k)=>{const x0=k*w+w*.15,hi=x.i/m*H,ho=x.o/m*H;
    return `<rect class="bi" x="${x0}" y="${H-hi}" width="${bw}" height="${hi}" rx="3"/><rect class="bo" x="${x0+bw+2}" y="${H-ho}" width="${bw}" height="${ho}" rx="3"/><text class="bt" x="${k*w+w/2}" y="${H+14}" text-anchor="middle">${x.l}</text>`}).join("")
    +`</svg><div class="lg"><span><i class="dot" style="background:var(--pos)"></i>In</span><span><i class="dot" style="background:var(--neg)"></i>Out</span></div>`;
}
function donut(e,o){
  let a=0;const R=40,C=2*Math.PI*R;
  return `<svg viewBox="0 0 100 100" width="140" height="140"><g transform="rotate(-90 50 50)">`+e.map(([c,v],k)=>{const l=v/o*C,s=`<circle cx="50" cy="50" r="${R}" fill="none" stroke="${PAL[k%8]}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-a}"/>`;a+=l;return s}).join("")+"</g></svg>";
}

/* ---- rows ---- */
function txRow(t,va){
  const del=`<button class="x" onclick="delTx('${t.id}')">×</button>`;
  if(t.type=="tr"){
    const s=va?(t.to==va?"+":"-"):"",c=va?(t.to==va?"pos":"neg"):"";
    return `<div class="row"><div class="grow"><b>${an(t.from)} → ${an(t.to)}</b><div class="sm">Transfer${t.desc?" · "+esc(t.desc):""} · ${t.date}</div></div><b class="${c}">${s}${fmt(+t.amount)}</b>${del}</div>`;
  }
  return `<div class="row"><div class="grow"><b>${esc(t.desc||t.cat)}</b><div class="sm">${esc(t.cat||"")} · ${an(t.acct)} · ${t.date}</div></div><b class="${t.type=="in"?"pos":"neg"}">${t.type=="in"?"+":"-"}${fmt(+t.amount)}</b>${del}</div>`;
}
const byDate=l=>[...l].sort((x,y)=>y.date.localeCompare(x.date));

/* ---- views ---- */
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v==view));
  V.forEach(v=>$("v-"+v).hidden=v!=view);
  ({sum:rSum,day:rDay,money:rMoney,acc:rAcc,debt:rDebt})[view]();
}
function rSum(){
  const[a,b,da,db]=range(off),[i,o]=tot(a,b);
  const dp=S.tx.filter(t=>t.type=="out"&&t.cat=="Debt payment"&&t.date>=a&&t.date<=b).reduce((s,t)=>s+ +t.amount,0);
  $("plabel").textContent=per=="week"?`${fd(da)} – ${fd(db)}`:da.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  $("cards").innerHTML=card("Income",i,"pos")+card("Spent",o,"neg")+card("Net",i-o,i-o<0?"neg":"pos")+card("Total money",allBal(),"")+card("Debt paid",dp,"")+card("Debt left",debtLeft(),"warn");
  const d=[];
  for(let k=5;k>=0;k--){const[x,y,dx]=range(off-k),[p,q]=tot(x,y);d.push({l:per=="week"?fd(dx):dx.toLocaleDateString(undefined,{month:"short"}),i:p,o:q})}
  $("chart").innerHTML=bars(d);
  const m={};S.tx.filter(t=>t.type=="out"&&t.date>=a&&t.date<=b).forEach(t=>{const c=t.cat||"Other";m[c]=(m[c]||0)+ +t.amount});
  const e=Object.entries(m).sort((x,y)=>y[1]-x[1]);
  $("cats").innerHTML=e.length?`<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${donut(e,o)}<div class="grow" style="min-width:160px">${e.map(([c,v],k)=>`<div class="row" style="padding:5px 0"><i class="dot" style="background:${PAL[k%8]}"></i><span class="grow">${esc(c)}</span><span>${fmt(v)}</span></div>`).join("")}</div></div>`:'<span class="muted">No spending in this period.</span>';
  $("hist").innerHTML=d.slice().reverse().map(x=>`<tr><td>${x.l}</td><td class="pos">${fmt(x.i)}</td><td class="neg">${fmt(x.o)}</td><td class="${x.i-x.o<0?"neg":""}">${fmt(x.i-x.o)}</td></tr>`).join("");
}
function rDay(){
  const d=$("dday").value,[i,o]=tot(d,d),base=new Date(d+"T00:00:00"),arr=[];
  $("dcards").innerHTML=card("Income",i,"pos")+card("Spent",o,"neg")+card("Net",i-o,i-o<0?"neg":"pos")+card("Total money",allBal(),"");
  for(let k=6;k>=0;k--){const x=new Date(base);x.setDate(x.getDate()-k);const s=iso(x),[p,q]=tot(s,s);arr.push({l:x.toLocaleDateString(undefined,{weekday:"short"}),i:p,o:q})}
  $("dchart").innerHTML=bars(arr);
  const l=S.tx.filter(t=>t.date==d);
  $("dlist").innerHTML=l.length?l.map(t=>txRow(t)).join(""):'<span class="muted">No entries on this day.</span>';
}
function rMoney(){
  const l=byDate(S.tx).slice(0,200);
  $("txs").innerHTML=l.length?l.map(t=>txRow(t)).join(""):'<span class="muted">Nothing yet.</span>';
}
function rAcc(){
  $("acards").innerHTML=ACCTS.map(([k,n])=>{const[i,o]=mon(k),b=bal(k);
    return `<div class="card"><div class="k">${n}</div><div class="v ${b<0?"neg":""}">${fmt(b)}</div><div class="sm">This month: <span class="pos">+${fmt(i)}</span> <span class="neg">-${fmt(o)}</span></div><div class="sm"><a href="#" onclick="setBal('${k}');return false">Adjust balance</a></div></div>`}).join("");
  $("chips").innerHTML=[["all","All"],...ACCTS].map(([k,n])=>`<button class="${fa==k?"on":""}" onclick="fa='${k}';render()">${n}</button>`).join("");
  const l=byDate(S.tx.filter(t=>fa=="all"||(t.type=="tr"?t.from==fa||t.to==fa:(t.acct||"cash")==fa))).slice(0,200);
  $("alist").innerHTML=l.length?l.map(t=>txRow(t,fa=="all"?"":fa)).join(""):'<span class="muted">Nothing yet.</span>';
}
function rDebt(){
  $("debts").innerHTML=S.debts.length?S.debts.map(d=>{const left=Math.max(0,d.total-d.paid),p=Math.min(100,d.paid/d.total*100);
    return `<div class="row"><div class="grow"><b>${esc(d.name)}</b><div class="sm">${fmt(left)} left of ${fmt(d.total)}${d.due?" · due "+d.due:""}</div><div class="bar"><i style="width:${p}%"></i></div></div>${left>0?`<button onclick="payDebt('${d.id}')">Pay</button>`:'<span class="pos">Paid ✓</span>'}<button class="x" onclick="delDebt('${d.id}')">×</button></div>`}).join(""):'<span class="muted">No debts. 🎉</span>';
}

/* ---- actions ---- */
function addTx(){
  const a=parseFloat($("amt").value);if(!(a>0))return alert("Enter an amount");
  S.tx.push({id:uid(),type:mode,amount:a,acct:$("acct").value,desc:$("desc").value.trim(),cat:$("cat").value.trim()||(mode=="in"?"Income":"Other"),date:$("date").value||iso(new Date())});
  ["amt","desc","cat"].forEach(i=>$(i).value="");save();
}
function delTx(id){
  const t=S.tx.find(x=>x.id==id);if(!confirm("Delete this entry?"))return;
  if(t&&t.debt){const d=S.debts.find(x=>x.id==t.debt);if(d)d.paid=Math.max(0,d.paid-t.amount)}
  S.tx=S.tx.filter(x=>x.id!=id);save();
}
function addTr(){
  const a=parseFloat($("tra").value),f=parseFloat($("trf").value),from=$("trfrom").value,to=$("trto").value,d=$("trd").value||iso(new Date());
  if(!(a>0))return alert("Enter an amount");if(from==to)return alert("Pick two different accounts");
  S.tx.push({id:uid(),type:"tr",from,to,amount:a,date:d,desc:$("trn").value.trim()});
  if(f>0)S.tx.push({id:uid(),type:"out",amount:f,acct:from,cat:"Transfer fee",desc:`Fee: ${an(from)} → ${an(to)}`,date:d});
  ["tra","trf","trn"].forEach(i=>$(i).value="");save();
}
function setBal(k){
  const v=parseFloat(prompt(`What is the balance of ${an(k)} right now? (${CUR})`));if(isNaN(v))return;
  S.open[k]=v-(bal(k)-(+S.open[k]||0));save();
}
function addDebt(){
  const n=$("dn").value.trim(),t=parseFloat($("dt").value);if(!n||!(t>0))return alert("Enter a name and total");
  S.debts.push({id:uid(),name:n,total:t,paid:parseFloat($("dp").value)||0,due:$("dd").value});
  ["dn","dt","dp","dd"].forEach(i=>$(i).value="");save();
}
function payDebt(id){
  const d=S.debts.find(x=>x.id==id),v=parseFloat(prompt(`Payment for ${d.name} (${CUR}), from ${an($("payacct").value)}:`));
  if(!(v>0))return;d.paid+=v;
  S.tx.push({id:uid(),type:"out",amount:v,acct:$("payacct").value,debt:id,desc:"Payment: "+d.name,cat:"Debt payment",date:iso(new Date())});save();
}
function delDebt(id){if(confirm("Delete this debt? (Its payment entries stay in your history.)")){S.debts=S.debts.filter(d=>d.id!=id);save()}}

/* ---- auth + sync ---- */
function fail(e){$("err").textContent=e.message.replace("Firebase: ","")}
function signIn(){auth.signInWithEmailAndPassword($("em").value,$("pw").value).catch(fail)}
function signUp(){auth.createUserWithEmailAndPassword($("em").value,$("pw").value).catch(fail)}
function signOut(){auth.signOut()}
const load=src=>new Promise((r,j)=>{const s=document.createElement("script");s.src=src;s.onload=r;s.onerror=j;document.head.appendChild(s)});

async function boot(){
  const o=ACCTS.map(a=>`<option value="${a[0]}">${a[1]}</option>`).join("");
  ["acct","trfrom","trto","payacct"].forEach(i=>$(i).innerHTML=o);
  $("acct").value=$("payacct").value="cash";$("trfrom").value="gcash";$("trto").value="maribank";
  ["date","trd","dday"].forEach(i=>$(i).value=iso(new Date()));
  if(!CFG.apiKey){
    try{S=norm(JSON.parse(localStorage.getItem("budget")))}catch(e){}
    $("app").hidden=false;render();return;
  }
  const b="https://www.gstatic.com/firebasejs/10.12.2/firebase-";
  await load(b+"app-compat.js");await Promise.all([load(b+"auth-compat.js"),load(b+"firestore-compat.js")]);
  firebase.initializeApp(CFG);auth=firebase.auth();fs=firebase.firestore();
  let unsub=null;
  auth.onAuthStateChanged(u=>{
    if(unsub){unsub();unsub=null}
    if(!u){ref=null;$("app").hidden=true;$("login").hidden=false;return}
    $("login").hidden=true;$("app").hidden=false;$("out").hidden=false;
    ref=fs.collection("budgets").doc(u.uid);
    unsub=ref.onSnapshot(s=>{S=norm(s.exists?s.data():null);render()});
  });
}
boot();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
